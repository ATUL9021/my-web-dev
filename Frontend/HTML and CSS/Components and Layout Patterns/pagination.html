<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagination</title>

    <style>
      .btn:hover {
        background-color: #087f5b;
        border-radius: 50%;
        border: 2px solid black;
      }
      .btn {
        height: 10px;
        width: 10px;
        padding: 20px;
        font-size: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: white;
        border-radius: 50%;
        border: 2px solid black;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.042);
      }

      .btn-left,
      .btn-left:hover {
        height: auto;
        width: auto;
        padding: 16px;
      }
      .btn-right,
      .btn-right:hover {
        height: auto;
        width: auto;
        padding: 16px;
      }

      .icon {
        width: 24px;
        height: 24px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        color: #adb5bd;
      }
      .pagination {
        display: flex;
        gap: 20px;
        width: 80%;
        margin: 100px auto;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="pagination">
      <button class="btn btn-left">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 19.5 8.25 12l7.5-7.5"
          />
        </svg>
      </button>

      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <span>...</span>
      <button class="btn">234</button>

      <button class="btn btn-right">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m8.25 4.5 7.5 7.5-7.5 7.5"
          />
        </svg>
      </button>
    </div>
  </body>
</html>
